<!DOCTYPE html>
<html>
 <head>
    <title>Webapps Assignment 6</title>
 </head>
<body>
<h1>Logan Masters sales computation</h1>
<br>
<form>
    <label for="numberItems">Enter number items</label>
    <input id="numberItems" type="number" value="1">
    <br>

    <label for="itemCost">Enter the cost of one item</label>
    <input id="itemCost" type="number" value="20.0">
    <br>

    <label for="numberForDiscount">Enter number to get discount</label>
    <input id="numberForDiscount" type="number" value="10">
    <br>

    <label for="discountRate">Enter the discount rate</label>
    <input id="discountRate" type="number" value="0.15">
    <br>

    <input type="button" onclick="doDiscount()" value="Show costs">
</form>
<br>
<p id="result">Results here...</p>
<script> 
    function doDiscount(){
        num = document.getElementById("numberItems").value;
        cost = document.getElementById("itemCost").value;
        discountAt = document.getElementById("numberForDiscount").value;
        rate = document.getElementById("discountRate").value;
        costs = "";
        for (i = 1; i < 6; i++){
            checkCount = num * i;
            if (checkCount >= discountAt){
                costs += "checkCount " + checkCount + " is " + ((discountAt * cost) + (((checkCount-discountAt)*cost)*(1-rate))) + "; ";
            } else {
                costs += "checkCount " + checkCount + " is " + checkCount * cost + "; ";
            }
        }
        result = document.getElementById("result");
        result.innerHTML = "Costs are: "+costs;
    }
</script>
<br>

<form>
        <input type="radio" id="mul" name="op" value="mul"  checked >
        <label for="mul">Product</label></br>
      
        <input type="radio" id="div" name="op" value="div">
        <label for="div">Divide</label></br>

        <input type="radio" id="add" name="op" value="add">
        <label for="add">Sum</label></br>

        <input type="radio" id="sub" name="op" value="sub">
        <label for="div">Subtract</label></br>

        <input type="button" onclick="chooseOp()" value="Commence operation">
      </form>
      <br>
      <p id="result2">Results here...</p>
      <script>
        function chooseOp(){
            count = document.getElementById("numberItems").value;
            discountAt = document.getElementById("numberForDiscount").value;
            result = document.getElementById("result2");
            if (document.getElementById("mul").checked){
                result.innerHTML = count * discountAt;
            }
            if (document.getElementById("div").checked){
                if (discountAt != 0){
                    result.innerHTML = count / discountAt;
                } else {
                    result.innerHTML = "DO NOT DIVIDE BY ZERO!!!!!!!!!!! FOOL"
                }
            }
            if (document.getElementById("add").checked){
                result.innerHTML = Number(count) + Number(discountAt);
            }
            if (document.getElementById("sub").checked){
                result.innerHTML = count - discountAt;
            }
        }
        </script>
</body>
</html>
